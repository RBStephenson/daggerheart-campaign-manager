services:
  backend:
    build: ./backend
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
      - dhcm-data:/data
      # Repo-root .env, bind-mounted so DHCM-100's auto-generated
      # DHCM_FERNET_KEY (written from inside the container) lands back on
      # the host and survives a container recreate, not just a restart.
      - ./.env:/app/.env
    environment:
      DHCM_DATABASE_URL: sqlite:////data/dhcm.sqlite3
      DHCM_GM_USERNAME: ${DHCM_GM_USERNAME:-}
      DHCM_GM_PASSWORD: ${DHCM_GM_PASSWORD:-}
      DHCM_PLAYER_USERNAME: ${DHCM_PLAYER_USERNAME:-}
      DHCM_PLAYER_PASSWORD: ${DHCM_PLAYER_PASSWORD:-}
      DHCM_SECRET_KEY: ${DHCM_SECRET_KEY:-}
      DHCM_FERNET_KEY: ${DHCM_FERNET_KEY:-}
      DHCM_ENV_FILE: /app/.env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  dhcm-data:
